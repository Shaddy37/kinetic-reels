name: bootstrap
on:
  push:
    branches: [main]
    paths: ['bootstrap/url.txt']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify, unpack
        run: |
          set -e
          URL=$(sed -n 1p bootstrap/url.txt); SHA=$(sed -n 2p bootstrap/url.txt)
          curl -sSL --retry 4 -o /tmp/b.zip "$URL"
          GOT=$(sha256sum /tmp/b.zip | cut -d' ' -f1)
          echo "sha got $GOT want $SHA"
          [ "$GOT" = "$SHA" ] || { echo SHA MISMATCH; exit 1; }
          unzip -oq /tmp/b.zip -x '.github/*'
          git rm -rq bootstrap
          find . -name __pycache__ -type d -prune -exec rm -rf {} \;
          git config user.name kinetic-reels-bot; git config user.email kinetic-reels-bot@users.noreply.github.com
          git add -A; git reset -q .github || true
          git commit -qm "Scene kit, Opus 5.5, 3-OS + real-voice tests, reference reel 2, guide images"
          git push origin HEAD:main
          echo INSTALLED
