name: bootstrap
# One-time installer. It downloads the skill bundle named in bootstrap/url.txt, checks its sha256, unpacks it into the repo and commits.
on:
  push:
    paths: ['bootstrap/url.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch, verify, unpack, commit
        run: |
          set -e
          [ -f bootstrap/url.txt ] || { echo 'nothing to install'; exit 0; }
          URL=$(sed -n 1p bootstrap/url.txt); SHA=$(sed -n 2p bootstrap/url.txt)
          curl -sSL --retry 3 -o /tmp/b.zip "$URL"
          GOT=$(sha256sum /tmp/b.zip | cut -d' ' -f1)
          echo "sha256 $GOT"
          if [ "$GOT" != "$SHA" ]; then echo "SHA MISMATCH (expected $SHA)" > bootstrap/LOG.txt; else
            unzip -oq /tmp/b.zip -d .
            rm -f bootstrap/url.txt
            { echo "installed $(date -u +'%Y-%m-%d %H:%M') UTC, sha256 $GOT"; find skills docs -type f | sort; } > bootstrap/LOG.txt
          fi
          git config user.name 'kinetic-reels-bot'; git config user.email 'kinetic-reels-bot@users.noreply.github.com'
          git add -A; git commit -qm 'Add the kinetic-reels skill: engine, scripts, template, fonts, CC0 music, gold example reel' || true
          git push
